<!-- Styles -->
<style>
    html, body, #mainContainer, #chartdiv {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #1a1c23;
    }
</style>

<!-- Resources -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Dark.js"></script>

<!-- Chart code -->
<script>
    am5.ready(function() {

// Create root element
// https://www.amcharts.com/docs/v5/getting-started/#Root_element
        var root = am5.Root.new("chartdiv");

        root._logo.dispose();

        var baseTime = new Date().getTime() - am5.time.getDuration("day", 2);

// Set themes
// https://www.amcharts.com/docs/v5/concepts/themes/
        root.setThemes([
            am5themes_Animated.new(root),
            am5themes_Dark.new(root)
        ]);

// Create the map chart
// https://www.amcharts.com/docs/v5/charts/map-chart/
        var selectedSatelliteName = null;

        window.setSelectedSatellite = function(name) {
            selectedSatelliteName = name;
            satelliteSeries.data.each(function(dataItem) {
                satelliteSeries.data.setAll(satelliteSeries.data.values);
            });
        };

        var chart = root.container.children.push(am5map.MapChart.new(root, {
            panX: false,
            panY: false,
            wheelX: "none",
            wheelY: "none",
            projection: am5map.geoEquirectangular(),
            paddingTop: 0,
            paddingBottom: 0,
            paddingLeft: 0,
            paddingRight: 0,
        }));

        chart.seriesContainer.setAll({
            draggable: false,
            resizable: false
        })

        chart.chartContainer.set("background", am5.Rectangle.new(root, {
            fill: am5.color(0x1a1c23),
            fillOpacity: 1
        }));

        chart.set("homeZoomLevel", 1);
        chart.set("homeGeoPoint", { longitude: 0, latitude: 0 });

// Create series for background fill
// https://www.amcharts.com/docs/v5/charts/map-chart/map-polygon-series/#Background_polygon
        var backgroundSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {}));
        backgroundSeries.mapPolygons.template.setAll({
            fill: root.interfaceColors.get("alternativeBackground"),
            fillOpacity: 0,
            strokeOpacity: 0
        });

// Add background polygon
// https://www.amcharts.com/docs/v5/charts/map-chart/map-polygon-series/#Background_polygon
        backgroundSeries.data.push({
            geometry: am5map.getGeoRectangle(90, 180, -90, -180)
        });

// Create main polygon series for countries
// https://www.amcharts.com/docs/v5/charts/map-chart/map-polygon-series/
        var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_worldLow
        }));


// Satellite point series
        var satelliteSeries = chart.series.push(am5map.MapPointSeries.new(root, {}));

        satelliteSeries.bullets.push(function(root, series, dataItem) {
            var container = am5.Container.new(root, { cursorOverStyle: "pointer" });

            var isSelected = dataItem.dataContext && dataItem.dataContext.name === selectedSatelliteName;

            var circle = am5.Circle.new(root, {
                radius: isSelected ? 9 : 6,
                fill: am5.color(isSelected ? 0xffc300 : 0x3fb9ff),
                stroke: am5.color(0xffffff),
                strokeWidth: isSelected ? 2 : 1
            });

            var label = am5.Label.new(root, {
                text: "{name}",
                fill: am5.color(0xe6edf3),
                fontSize: 11,
                paddingLeft: 12,
                centerY: am5.p50,
                populateText: true
            });

            container.children.push(circle);
            container.children.push(label);

            container.events.on("click", function(ev) {
                var dataItem = ev.target.dataItem;
                var name = dataItem && dataItem.dataContext ? dataItem.dataContext.name : null;
                if (name && window.onSatelliteClicked) {
                    window.onSatelliteClicked(name);
                }
            });

            return am5.Bullet.new(root, { sprite: container });
        });

        window.updateSatellites = function(satellites) {
            var data = satellites.map(function(s) {
                return {
                    geometry: { type: "Point", coordinates: [s.lon, s.lat] },
                    name: s.name
                };
            });
            satelliteSeries.data.setAll(data);
        };

// Create point series for Sun icon
// https://www.amcharts.com/docs/v5/charts/map-chart/map-point-series/
        var sunSeries = chart.series.push(am5map.MapPointSeries.new(root, {}));
        var sunDataItem = sunSeries.pushDataItem({});

// Create polygon series for night-time polygons
// https://www.amcharts.com/docs/v5/charts/map-chart/map-polygon-series/
        var nightSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {}));

        nightSeries.mapPolygons.template.setAll({
            fill: am5.color(0x000000),
            fillOpacity: 0.25,
            strokeOpacity: 0
        });

        var nightDataItem0 = nightSeries.pushDataItem({});
        var nightDataItem1 = nightSeries.pushDataItem({});
        var nightDataItem2 = nightSeries.pushDataItem({});

        function updateDateNight(time) {
            var sunPosition = solarPosition(time);

            var customOffset = -40;

            sunDataItem.set("longitude", sunPosition.longitude);
            sunDataItem.set("latitude", sunPosition.latitude);

            var nightLon = sunPosition.longitude + 180 + customOffset;

            var nightPosition = am5map.normalizeGeoPoint({
                longitude: nightLon,
                latitude: -sunPosition.latitude
            });

            nightDataItem0.set("geometry", am5map.getGeoCircle(nightPosition, 92));
            nightDataItem1.set("geometry", am5map.getGeoCircle(nightPosition, 90));
            nightDataItem2.set("geometry", am5map.getGeoCircle(nightPosition, 88));
        }

        updateDateNight(new Date().getTime());

        setInterval(function() {
            var now = new Date();
            var utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            updateDateNight(utcTime);
        }, 60000);

        var offset = new Date().getTimezoneOffset() * 60 * 1000;

// all sun position calculation is taken from: http://bl.ocks.org/mbostock/4597134
        function solarPosition(time) {
            var centuries = (time - Date.UTC(2000, 0, 1, 12)) / 864e5 / 36525;

            var longitude = ((time % 86400000) / 86400000) * 360 - 180;

            return am5map.normalizeGeoPoint({
                longitude: longitude - (equationOfTime(centuries) * am5.math.DEGREES),
                latitude: solarDeclination(centuries) * am5.math.DEGREES
            });
        }

        var trajectorySeries = chart.series.push(am5map.MapLineSeries.new(root, {}));
        trajectorySeries.mapLines.template.setAll({
            stroke: am5.color(0xff9500),
            strokeWidth: 2,
            strokeOpacity: 0.6,
            strokeDasharray: [4, 4]
        })

        window.setTrajectory = function(points) {
            console.log("setTrajectory called with " + points.length + " points");
            console.log("First point: " + JSON.stringify(points[0]));
            trajectorySeries.data.setAll([{
                geometry: {
                    type: "LineString",
                    coordinates: points.map(p => [p.lon, p.lat])
                }
            }]);
        };
// Equations based on NOAA’s Solar Calculator; all angles in RADIANS.
// http://www.esrl.noaa.gov/gmd/grad/solcalc/

        function equationOfTime(centuries) {
            var e = eccentricityEarthOrbit(centuries),
                m = solarGeometricMeanAnomaly(centuries),
                l = solarGeometricMeanLongitude(centuries),
                y = Math.tan(obliquityCorrection(centuries) / 2);

            y *= y;
            return (
                y * Math.sin(2 * l) -
                2 * e * Math.sin(m) +
                4 * e * y * Math.sin(m) * Math.cos(2 * l) -
                0.5 * y * y * Math.sin(4 * l) -
                1.25 * e * e * Math.sin(2 * m)
            );
        }

        function solarDeclination(centuries) {
            return Math.asin(
                Math.sin(obliquityCorrection(centuries)) *
                Math.sin(solarApparentLongitude(centuries))
            );
        }

        function solarApparentLongitude(centuries) {
            return (
                solarTrueLongitude(centuries) -
                (0.00569 +
                    0.00478 * Math.sin((125.04 - 1934.136 * centuries) * am5.math.RADIANS)) *
                am5.math.RADIANS
            );
        }

        function solarTrueLongitude(centuries) {
            return (
                solarGeometricMeanLongitude(centuries) + solarEquationOfCenter(centuries)
            );
        }

        function solarGeometricMeanAnomaly(centuries) {
            return (
                (357.52911 + centuries * (35999.05029 - 0.0001537 * centuries)) *
                am5.math.RADIANS
            );
        }

        function solarGeometricMeanLongitude(centuries) {
            var l = (280.46646 + centuries * (36000.76983 + centuries * 0.0003032)) % 360;
            return ((l < 0 ? l + 360 : l) / 180) * Math.PI;
        }

        function solarEquationOfCenter(centuries) {
            var m = solarGeometricMeanAnomaly(centuries);
            return (
                (Math.sin(m) * (1.914602 - centuries * (0.004817 + 0.000014 * centuries)) +
                    Math.sin(m + m) * (0.019993 - 0.000101 * centuries) +
                    Math.sin(m + m + m) * 0.000289) *
                am5.math.RADIANS
            );
        }

        function obliquityCorrection(centuries) {
            return (
                meanObliquityOfEcliptic(centuries) +
                0.00256 *
                Math.cos((125.04 - 1934.136 * centuries) * am5.math.RADIANS) *
                am5.math.RADIANS
            );
        }

        function meanObliquityOfEcliptic(centuries) {
            return (
                (23 +
                    (26 +
                        (21.448 -
                            centuries * (46.815 + centuries * (0.00059 - centuries * 0.001813))) /
                        60) /
                    60) *
                am5.math.RADIANS
            );
        }

        function eccentricityEarthOrbit(centuries) {
            return 0.016708634 - centuries * (0.000042037 + 0.0000001267 * centuries);
        }
    }); // end am5.ready()
</script>

<!-- HTML -->
<div id="mainContainer">
    <div id="chartdiv"></div>
</div>
